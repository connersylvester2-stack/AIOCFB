<!doctype html>
<!-- College football model dashboard. Tabs: Power rankings, Cover trends, Games, CFB bets (with weekly record and profit), Recommended bets. Version 2026-10-10 weeks-recs. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CFB Model">
<title>College Football Model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDEFF2; --surface:#FFFFFF; --ink:#162033; --muted:#5F6B7C; --line:#D6DBE3;
  --pos:#1F6F5C; --pos-bg:#DCEFE9; --neg:#B5483D; --neg-bg:#F6E0DD; --gold:#E8B100; --track:#E4E8EE;
  box-sizing:border-box; padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0F1623; --surface:#172131; --ink:#E7ECF3; --muted:#9AA7B8; --line:#27344A;
    --pos:#4FC3A5; --pos-bg:#12362D; --neg:#EE8478; --neg-bg:#3A1E1B; --gold:#F2C230; --track:#223048}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,-apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:980px;margin:0 auto;padding:22px 16px 56px}
h1{font:700 34px/1.05 "Barlow Condensed",Barlow,sans-serif;letter-spacing:.01em;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 18px;max-width:62ch}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;color:var(--muted);font:600 19px "Barlow Condensed",Barlow,sans-serif;padding:10px 14px;min-height:44px;cursor:pointer;border-bottom:4px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.controls input,.controls select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
.controls input{flex:1 1 180px}
button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.status{color:var(--muted);font-size:14px;min-height:20px;margin:0 0 10px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
details{border-bottom:1px solid var(--line)} details:last-child{border-bottom:0}
summary{list-style:none;cursor:pointer;padding:11px 14px;min-height:58px;display:grid;gap:10px;align-items:center}
summary::-webkit-details-marker{display:none}
.rk{font:700 22px "Barlow Condensed",sans-serif;color:var(--muted);text-align:right}
.tm b{display:block;font:700 20px/1.1 "Barlow Condensed",sans-serif}
.tm small{color:var(--muted);font-size:13px}
.num{text-align:right;font-weight:500}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.dim{color:var(--muted);font-size:13px}
/* rankings */
.r-row{grid-template-columns:40px 1.2fr 1.4fr 120px}
.div{position:relative;height:18px;background:var(--track);border-radius:4px}
.div::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.35}
.div i{position:absolute;top:0;bottom:0;border-radius:3px}
.div i.p{background:var(--pos)} .div i.n{background:var(--neg)}
.rate{display:grid;grid-template-columns:1fr 52px;gap:8px;align-items:center}
/* cover */
.c-row{grid-template-columns:1.4fr .8fr .7fr .7fr .8fr}
/* games */
.g-row{grid-template-columns:72px 1.3fr 1fr 1.2fr}
.wp{display:flex;height:18px;border-radius:4px;overflow:hidden;background:var(--track)}
.wp i{display:block;height:100%} .wp .a{background:var(--muted);opacity:.55} .wp .h{background:var(--ink)}
.wpl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:2px}
.day{background:var(--bg);padding:8px 14px;font:700 17px "Barlow Condensed",sans-serif;color:var(--muted);border-bottom:1px solid var(--line)}
.mt div{font:700 18px/1.15 "Barlow Condensed",sans-serif} .mt span{color:var(--muted);font:500 13px Barlow,sans-serif}
/* recommended bets */
.x-row{grid-template-columns:36px 1fr 112px}
.xr{text-align:right}
.xr b{display:block;font:700 22px/1.1 "Barlow Condensed",sans-serif}
.xr small{color:var(--muted);font-size:13px;white-space:nowrap}
.pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.pill{font:600 12px Barlow,sans-serif;padding:1px 8px;border-radius:99px;background:var(--track);color:var(--muted)}
.pill.bet{background:var(--pos-bg);color:var(--pos)}
.pill.lean{background:rgba(232,177,0,.22);color:var(--ink)}
.pill.warn{background:var(--neg-bg);color:var(--neg)}
.chipcap{color:var(--muted);font-size:13px;margin:0 0 4px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{font:600 18px "Barlow Condensed",Barlow,sans-serif;min-height:44px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.chip small{font:500 13px Barlow,sans-serif;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#162033}
.chip[aria-pressed="true"] small{color:#162033;opacity:.75}
.badge{font-size:13px;font-weight:600;padding:3px 9px;border-radius:99px;text-align:center}
.badge.open{background:var(--track);color:var(--muted)}
.detail{padding:6px 14px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 18px}
.detail .t{border-bottom:1px dashed var(--line);padding-bottom:4px}
.detail .t span{display:block;color:var(--muted);font-size:12px} .detail .t b{font-weight:600}
.detail .wide{grid-column:1/-1;font-size:14px;color:var(--muted)}
.empty{padding:28px 16px;color:var(--muted)}
.note{color:var(--muted);font-size:13px;margin-top:18px;max-width:72ch}
/* my bets */
.btools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.btn{font:600 17px "Barlow Condensed",Barlow,sans-serif;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary,.btn[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#162033}
.btn.small{min-height:36px;font-size:16px;padding:0 12px}
.btn.danger{color:var(--neg)}
.bsum{display:grid;grid-template-columns:1.5fr repeat(4,1fr);margin-bottom:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.bsum>div{padding:12px 14px} .bsum>div+div{border-left:1px solid var(--line)}
.bsum span{display:block;color:var(--muted);font-size:13px}
.bsum b{display:block;font:700 22px/1.15 "Barlow Condensed",sans-serif}
.bsum .big b{font-size:34px}
.bx{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.bf{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}
.bf label{display:block;color:var(--muted);font-size:13px;margin-bottom:3px}
.bf input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
.s5{grid-column:span 5}.s7{grid-column:span 7}.s3{grid-column:span 3}.s2{grid-column:span 2}.s4{grid-column:span 4}.s12{grid-column:span 12}
.bmath{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.bmath .m{display:flex;gap:26px;flex-wrap:wrap}
.bmath .m span{display:block;color:var(--muted);font-size:12px}
.bmath .m b{font:700 20px "Barlow Condensed",sans-serif}
.berr{color:var(--neg);min-height:1.3em;margin:8px 0 0;font-size:14px}
.bact{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bact select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 10px;min-height:36px}
.b-row{grid-template-columns:62px 1.6fr 90px 100px}
.bbreak{padding:0;overflow:hidden}
.bbreak table{width:100%;border-collapse:collapse}
.bbreak th,.bbreak td{padding:9px 14px;text-align:right}
.bbreak th:first-child,.bbreak td:first-child{text-align:left}
.bbreak thead th{font-weight:600;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}
.bbreak tbody tr+tr td{border-top:1px solid var(--line)}
.bbreak tfoot td{border-top:2px solid var(--line);font-weight:700}
.bbreak tr.on td{background:var(--bg)}
.bbreak .cap{padding:10px 14px 0;color:var(--muted);font-size:13px}
.wkbtn{background:none;border:0;color:var(--ink);font:600 16px Barlow,sans-serif;padding:6px 0;min-height:36px;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.evid{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.evid>summary{min-height:56px}
.evb table{margin-bottom:8px}
.evb tr.small td{color:var(--muted)}
.sybar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.sybar .st{flex:1 1 240px;color:var(--muted);font-size:14px}
.st.good{color:var(--pos)} .st.bad{color:var(--neg)}
.steps{margin:8px 0 14px;padding-left:20px;color:var(--muted);font-size:14px}
.steps li{margin-bottom:4px}
@media (max-width:700px){
  .r-row{grid-template-columns:34px 1fr 1.1fr} .r-row .rr{display:none}
  .c-row{grid-template-columns:1.3fr .8fr .7fr} .c-row .hide-s{display:none}
  .g-row{grid-template-columns:62px 1fr} .g-row .gx{display:none}
  .x-row{grid-template-columns:30px 1fr 98px}
  .bsum{grid-template-columns:1fr 1fr} .bsum .big{grid-column:1/-1;border-bottom:1px solid var(--line)}
  .bsum>div:nth-child(2),.bsum>div:nth-child(4){border-left:0} .bsum>div:nth-child(n+4){border-top:1px solid var(--line)}
  .s5,.s7,.s3,.s2,.s4,.s12{grid-column:span 12} .s3.h{grid-column:span 6}
  .b-row{grid-template-columns:54px 1fr 84px} .b-row .hide-s{display:none}
  .bbreak .hide-s{display:none} .bbreak th,.bbreak td{padding:9px 10px}
}
</style>
</head>
<body>
<main>
  <h1>College football model</h1>
  <p class="sub">Power rankings, against-the-spread trends and model lines for FBS games. Everything here comes from the model's own numbers.</p>
  <div class="tabs" role="tablist" id="tabs"></div>
  <section id="extra" hidden></section>
  <section id="recbar" hidden></section>
  <div class="controls">
    <input id="q" type="search" placeholder="Search team" aria-label="Search team">
    <select id="sort" aria-label="Sort by"></select>
    <select id="conf" aria-label="Conference"></select>
  </div>
  <p class="status" id="status" aria-live="polite"></p>
  <div class="list" id="list"></div>
  <p class="note" id="note"></p>
</main>
<script>
// ===== SETTINGS: edit these =====
const CONFIG = {
  SHOW_RECOMMENDED: true,  // Recommended bets tab. GitHub Pages sites are public, so anyone with the link can read it. Set false if these picks are for subscribers only.
  SHOW_MY_BETS: true,      // CFB bets tab. Bets are saved only in the visitor's own browser (and your private sync repo), never in this repo.
  WEEK1_SATURDAY: "2026-09-05",  // Saturday of Week 1. A bet placed Sunday through Saturday counts toward that Saturday's week. You can override the week on any bet.
  RECS: {
    haircut: 0.06,      // Probability points removed from the model before ranking. Past BET picks won about 8 points less often than the model said.
    edgeCap: 20,        // Edges above this many cents are ranked down and marked "Check first". Set bigEdgeDecay to 0 to turn the ranking-down off.
    bigEdgeDecay: 0.5,
    totalGap: 7,        // Flag a total when the model total is this many points away from the Kalshi line.
    strongEdge: 5       // Edge (in cents, after the haircut) a bet needs to count as Strong in the confidence table.
  },
  // Past record (BET/LEAN/PASS, by category, calibration) is calculated from the ledger, flat 1-unit stakes with fees.
  files: {
    rankings: "output/power_rankings.csv",
    cover:    "output/cover_stats.csv",
    games:    "output/sim_results.csv",
    recs:     "output/recommendations.csv",  // needs columns: game, kickoff, market, pick, action, price_cents, model_prob, edge_cents, status, week
    ledger:   "ledger/picks_ledger.csv"      // graded picks. The past-record numbers are calculated from this file (latest season only).
  }
};
const W1=(()=>{const p=String(CONFIG.WEEK1_SATURDAY).split("-").map(Number);return Date.UTC(p[0],p[1]-1,p[2])})();

// ==== CORE (pure functions, no page access) ====
function parseCSV(t){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===','){row.push(f);f=""}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f="";if(row.length>1||row[0]!=="")rows.push(row);row=[]}
    else f+=c}
  if(f!==""||row.length){row.push(f);rows.push(row)}
  const h=(rows.shift()||[]).map(s=>s.trim());
  return rows.map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]===undefined?"":r[i]])));
}
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const N=x=>{const v=parseFloat(x);return isNaN(v)?null:v};
const f1=(x,d=1)=>{const v=N(x);return v===null?"–":v.toFixed(d)};
const sgn=(x,d=1)=>{const v=N(x);return v===null?"–":(v>0?"+":"")+v.toFixed(d)};
const tile=(k,v)=>`<div class="t"><span>${esc(k)}</span><b>${v}</b></div>`;
const cellHTML=(k,v,h,c,big)=>`<div${big?' class="big"':""}><span>${k}</span><b class="${c||""}">${v}</b>${h?`<span>${h}</span>`:""}</div>`;
const MKT={total:"Total",spread:"Spread",winner:"Winner"};

const SORTS={
  rankings:[["Overall rank","overall_rank",1],["Offense rank","off_rank",1],["Defense rank","def_rank",1],["Toughest schedule","sos_rank",1],
    ["Efficiency rank","efficiency_rank",1],["Rated above its efficiency","results_vs_efficiency",-1],["Rated below its efficiency","results_vs_efficiency",1]],
  cover:[["ATS rank","ats_rank",1],["Best cover %","ats_cover_pct",-1],["Worst cover %","ats_cover_pct",1],["Best avg cover margin","avg_cover_margin",-1],
    ["Most overs","over_pct",-1],["Most unders","under_pct",-1],["Most points above implied","avg_pts_vs_implied",-1],["Team total over %","team_total_over_pct",-1]],
  games:[["Kickoff","kickoff_utc",1],["Biggest model favorite","_absmargin",-1],["Highest model total","model_total",-1],["Lowest model total","model_total",1]],
  bets:[["Newest","date",-1],["Oldest","date",1],["Open first","_open",-1],["Biggest cost","cost",-1],["Best results first","_pnl",-1],["Worst results first","_pnl",1]],
  recs:[["Most confident","_score",-1],["Biggest model edge","_raw",-1],["Highest model chance","_prob",-1],["Cheapest price","_price",1],["Kickoff","kickoff_utc",1]]
};

function sortRows(rows,key,dir){
  const val=r=>key==="_absmargin"?Math.abs(N(r.model_margin_home)??0):(key==="kickoff_utc"||key==="date")?r[key]:key==="_pnl"?Bets.pnl(r):key==="_open"?(r.status==="pending"?1:0):N(r[key]);
  return rows.slice().sort((a,b)=>{const x=val(a),y=val(b);
    if(x===null||x===undefined)return 1; if(y===null||y===undefined)return -1;
    return (x<y?-1:x>y?1:0)*dir});
}

function divBar(v){const x=N(v)??0,w=Math.min(Math.abs(x)/26,1)*50;
  return `<span class="div"><i class="${x>=0?"p":"n"}" style="left:${x>=0?50:50-w}%;width:${w}%"></i></span>`}

function rankingRow(r){
  const gap=N(r.results_vs_efficiency);
  const gapTxt=gap===null?"":gap>=20?"Rated well above what its efficiency suggests.":gap<=-20?"Rated well below what its efficiency suggests.":"Rating and efficiency are roughly in line.";
  const rt=N(r.overall_rating);
  return `<details><summary class="r-row">
    <span class="rk">${esc(r.overall_rank)}</span>
    <span class="tm"><b>${esc(r.team)}</b><small>${esc(r.conference)}, ${esc(r.record)}</small></span>
    <span class="rate">${divBar(r.overall_rating)}<span class="num ${rt>=0?"pos":"neg"}">${sgn(r.overall_rating)}</span></span>
    <span class="rr dim">Off #${esc(r.off_rank)} &nbsp; Def #${esc(r.def_rank)}</span></summary>
    <div class="detail">
      ${tile("Offense rating (rank)",`${sgn(r.off_rating)} (#${esc(r.off_rank)})`)}
      ${tile("Defense rating (rank)",`${sgn(r.def_rating)} (#${esc(r.def_rank)})`)}
      ${tile("Schedule strength (rank)",`${sgn(r.sos)} (#${esc(r.sos_rank)})`)}
      ${tile("Points for / against",`${f1(r.ppg)} / ${f1(r.papg)}`)}
      ${tile("Avg margin",sgn(r.avg_margin))}
      ${tile("Last 3 games margin",sgn(r.last3_margin))}
      ${tile("Offense / defense PPA",`${f1(r.off_ppa,3)} / ${f1(r.def_ppa,3)}`)}
      ${tile("Success rate off / def",`${f1(N(r.off_success)*100,1)}% / ${f1(N(r.def_success)*100,1)}%`)}
      ${tile("Explosiveness off / def",`${f1(r.off_explosive,2)} / ${f1(r.def_explosive,2)}`)}
      ${tile("Efficiency rank",`#${f1(r.efficiency_rank,0)}`)}
      ${tile("Preseason rating",sgn(r.prior_rating))}
      <div class="wide">${esc(gapTxt)}</div></div></details>`;
}

function coverRow(r){
  const cp=N(r.ats_cover_pct),mg=N(r.avg_cover_margin);
  return `<details><summary class="c-row">
    <span class="tm"><b>${esc(r.team)}</b><small>${esc(r.conference)}</small></span>
    <span class="num">${esc(r.ats_record)}</span>
    <span class="num ${cp>=60?"pos":cp<=40?"neg":""}">${f1(cp,0)}%</span>
    <span class="num hide-s ${mg>=0?"pos":"neg"}">${sgn(mg)}</span>
    <span class="num hide-s">${esc(r.over_record)} <span class="dim">O/U</span></span></summary>
    <div class="detail">
      ${tile("Games with lines",esc(r.games_with_lines))}
      ${tile("Last 3 ATS",esc(r.ats_last3))}
      ${tile("As favorite",esc(r.ats_as_fav))}
      ${tile("As underdog",esc(r.ats_as_dog))}
      ${tile("Home",esc(r.ats_home))}
      ${tile("Away",esc(r.ats_away))}
      ${tile("Over / under %",`${f1(r.over_pct,0)}% / ${f1(r.under_pct,0)}%`)}
      ${tile("Avg total line",f1(r.avg_total_line))}
      ${tile("Avg actual game total",f1(r.avg_game_total))}
      ${tile("Avg points scored",f1(r.avg_pts))}
      ${tile("Avg implied team total",f1(r.avg_implied_team_total))}
      ${tile("Points vs implied",sgn(r.avg_pts_vs_implied))}
      ${tile("Team total over %",`${f1(r.team_total_over_pct,0)}%`)}
      ${tile("Share of total line",`${f1(r.avg_pts_share_of_line_pct)}%`)}
      ${tile("Share of game points",`${f1(r.avg_pts_share_of_game_pct)}%`)}
      <div class="wide">Small samples: most teams have 3 to 5 games with lines.</div></div></details>`;
}

function dayOf(k){return String(k||"").split(" ").slice(0,2).join(" ")}
function timeOf(k){return String(k||"").split(" ").slice(2).join(" ")}
function gameRow(g){
  const hw=N(g.home_win_pct)??50,aw=N(g.away_win_pct)??50;
  const wx=g.weather==="dome"?"Dome":esc(g.weather||"");
  const inj=g.injury_notes?`<div class="wide">Injuries: ${esc(g.injury_notes)}</div>`:"";
  return `<details><summary class="g-row">
    <span class="dim">${esc(timeOf(g.kickoff))}</span>
    <span class="mt"><div>${esc(g.away)} <span>#${esc(g.away_rank)}</span></div><div>${esc(g.home)} <span>#${esc(g.home_rank)}</span></div></span>
    <span class="gx"><b>${esc(g.model_line)}</b><div class="dim">Total ${f1(g.model_total)}</div></span>
    <span class="gx"><div class="wp" aria-label="Win probability"><i class="a" style="width:${aw}%"></i><i class="h" style="width:${hw}%"></i></div>
      <div class="wpl"><span>${esc(g.away)} ${f1(aw,0)}%</span><span>${f1(hw,0)}% ${esc(g.home)}</span></div></span></summary>
    <div class="detail">
      ${tile("Model line",esc(g.model_line))}
      ${tile("Model total",f1(g.model_total))}
      ${tile("Projected score",`${esc(g.away)} ${f1(g.exp_away_pts,0)}, ${esc(g.home)} ${f1(g.exp_home_pts,0)}`)}
      ${tile("Home win %",`${f1(hw,0)}%`)}
      ${tile("Margin spread (1 SD)",f1(g.sd_margin))}
      ${tile("Total spread (1 SD)",f1(g.sd_total))}
      ${tile("Home field points",f1(g.hfa_pts))}
      ${tile("Pace factor",f1(g.pace_mult,3))}
      ${tile("Weather total adj",sgn(g.weather_total_adj,2))}
      <div class="wide">Weather: ${wx}</div>${inj}</div></details>`;
}

// ---- Recommended bets: scoring, grouping and rows ----
// Adds the computed fields (_raw, _adj, _score, _prob, _price, _flags, _started) to one CSV row.
function recEnrich(r,cfg){
  r.market=String(r.market||"").toLowerCase();
  r.status=String(r.status||"").toUpperCase();
  const prob=N(r.model_prob),cents=N(r.price_cents),fee=N(r.fee)||0;
  let raw=N(r.edge_cents);
  if(raw===null&&prob!==null&&cents!==null)raw=(prob-cents/100-fee)*100;
  const adj=raw===null?null:raw-cfg.haircut*100;
  let score=adj;
  const big=raw!==null&&raw>cfg.edgeCap;
  if(big)score=(cfg.edgeCap-cfg.haircut*100)-(raw-cfg.edgeCap)*cfg.bigEdgeDecay;
  const flags=[];
  if(big)flags.push(`The model's edge is ${raw.toFixed(1)}c. Edges this large usually mean the model is missing something, so check injuries, quarterback news and weather first.`);
  if(r.market==="total"){
    const mt=N(r.model_total),k=N(r.strike);
    if(mt!==null&&k!==null&&Math.abs(mt-k)>=cfg.totalGap)flags.push(`The model total (${mt.toFixed(1)}) is ${Math.abs(mt-k).toFixed(1)} points from the Kalshi line (${k}). Check pace and weather.`);
  }
  const t=Date.parse(r.kickoff_utc);
  return Object.assign(r,{_raw:raw,_adj:adj,_score:score,_prob:prob===null?null:prob*100,_price:cents,_flags:flags,_started:!isNaN(t)&&t<Date.now()});
}
// Marks the highest-score bet in each game as _best.
function markBest(rows){
  const by=new Map();
  for(const r of rows){const k=r.game_id||r.game;if(!by.has(k))by.set(k,[]);by.get(k).push(r)}
  for(const g of by.values()){
    let best=g[0];for(const r of g)if((r._score??-1e9)>(best._score??-1e9))best=r;
    for(const r of g){r._best=r===best;r._multi=g.length>1}
  }
}
// Past record to show for the current filters.
function recapFor(recap,market,status){
  if(!recap)return null;
  const rec=(x,label)=>({label,n:x.n,w:x.w,l:x.l,units:x.units,roi:x.n?x.units/x.n*100:0});
  if(status==="LEANUP"){
    const a=recap.status.BET,b=recap.status.LEAN;
    return rec({n:a.n+b.n,w:a.w+b.w,l:a.l+b.l,units:Math.round((a.units+b.units)*10)/10},"Past BET + LEAN picks");
  }
  if(market!=="all"&&recap.market[market])return rec(recap.market[market],"Past BET picks, "+(MKT[market]||market).toLowerCase()+"s");
  if(status==="BET")return rec(recap.status.BET,"Past BET picks");
  return rec(recap.status.ALL,"All past picks");
}
function bandFor(recap,p){if(!recap||p===null||p===undefined)return null;return recap.bands.find(b=>p>=b.lo&&p<b.hi&&b.said!==null)||null}

// ---- Past record, calculated from the ledger ----
// Returns "w", "l", "p" (push) or null when the pick isn't graded yet.
function ledgerOutcome(r){
  const res=String(r.result||"").trim().toLowerCase();
  if(/^(w|win|won)$/.test(res))return "w";
  if(/^(l|loss|lost|lose)$/.test(res))return "l";
  if(/^(p|push|void|refund|refunded)$/.test(res))return "p";
  const yo=String(r.yes_outcome||"").trim().toLowerCase(),side=String(r.side||"").trim().toUpperCase();
  const yes=["1","yes","true","y"].includes(yo)?true:["0","no","false","n"].includes(yo)?false:null;
  if(yes!==null&&(side==="YES"||side==="NO"))return (side==="YES")===yes?"w":"l";
  return null;
}
// Units on a flat 1-unit stake: the ledger's own units column if filled in, otherwise computed from the logged price and fee.
function ledgerUnits(r,o){
  const u=N(r.units);if(u!==null)return u;
  if(o==="p")return 0;
  const cost=(N(r.price_cents)??NaN)/100+(N(r.fee)||0);
  if(!(cost>0))return 0;
  return o==="w"?(1-cost)/cost:-1;
}
// Graded picks from the latest season, with the edge numbers the confidence table needs.
function gradedPicks(rows,cfg){
  const seasons=rows.map(r=>N(r.season)).filter(x=>x!==null),season=seasons.length?Math.max(...seasons):null;
  const out=[];
  for(const r of rows){
    if(season!==null&&N(r.season)!==season)continue;
    const o=ledgerOutcome(r);if(!o)continue;
    const prob=N(r.model_prob),cents=N(r.price_cents),fee=N(r.fee)||0;
    let raw=N(r.edge_cents);
    if(raw===null&&prob!==null&&cents!==null)raw=(prob-cents/100-fee)*100;
    out.push({o,units:ledgerUnits(r,o),status:String(r.status||"").trim().toUpperCase(),market:String(r.market||"").trim().toLowerCase(),raw,adj:raw===null?null:raw-cfg.haircut*100});
  }
  return out;
}
// Record by edge size and by confidence tier, plus flat 1u vs 2.5u/1u sizing, for the picks matching the filters.
function evidence(picks,market,status,cfg){
  const stOk=p=>status==="BET"?p.status==="BET":status==="LEANUP"?(p.status==="BET"||p.status==="LEAN"):true;
  const set=picks.filter(p=>stOk(p)&&(market==="all"||p.market===market)&&p.raw!==null);
  const agg=list=>{const a={n:0,w:0,l:0,p:0,units:0};for(const p of list){a.n++;a[p.o]++;a.units+=p.units}a.units=Math.round(a.units*10)/10;return a};
  const bands=[["Under 0c",-1e9,0],["0 to 5c",0,5],["5 to 10c",5,10],["10 to 15c",10,15],["15 to 20c",15,20],["20 to 30c",20,30],["30c and up",30,1e9]];
  const byEdge=bands.map(([label,lo,hi])=>[label,agg(set.filter(p=>p.raw>=lo&&p.raw<hi))]);
  const tierOf=p=>p.raw>cfg.edgeCap?"check":p.adj>=cfg.strongEdge?"strong":p.adj>=0?"base":"below";
  const t={strong:[],base:[],check:[],below:[]};for(const p of set)t[tierOf(p)].push(p);
  const byTier=[[`Strong: ${cfg.strongEdge}c+ after haircut`,agg(t.strong)],[`Base: 0 to ${cfg.strongEdge}c after haircut`,agg(t.base)],
    [`Check first: over ${cfg.edgeCap}c`,agg(t.check)],["Below haircut: under 0c",agg(t.below)]];
  const s=byTier[0][1],b=byTier[1][1];
  return {set:agg(set),byEdge,byTier,sized:{bets:s.n+b.n,staked:2.5*s.n+b.n,units:Math.round((2.5*s.units+b.units)*10)/10}};
}
function evidHTML(picks,market,status,cfg,season){
  const e=evidence(picks,market,status,cfg);
  const scope=(status==="BET"?"BET picks":status==="LEANUP"?"BET + LEAN picks":"all picks")+(market==="all"?"":", "+(MKT[market]||market).toLowerCase()+"s only");
  if(!e.set.n)return `<div class="empty">No graded picks match these filters yet.</div>`;
  const pct=(u,n)=>n?(u/n>=0?"+":"")+(u/n*100).toFixed(1)+"%":"–";
  const cls=u=>u>0?"pos":u<0?"neg":"";
  const row=(label,a)=>`<tr${a.n<20?' class="small"':""}><td>${esc(label)}</td><td>${a.n}${a.n<20?"*":""}</td><td>${a.w}-${a.l}${a.p?"-"+a.p:""}</td><td class="${cls(a.units)}">${a.n?sgn(a.units):"–"}</td><td>${pct(a.units,a.n)}</td></tr>`;
  const head=first=>`<thead><tr><th>${first}</th><th>Bets</th><th>Record</th><th>Units</th><th>Return</th></tr></thead>`;
  const sizedRow=(label,bets,staked,units)=>`<tr><td>${label}</td><td>${bets}</td><td>${f1(staked,1)}</td><td class="${cls(units)}">${sgn(units)}</td><td>${pct(units,staked)}</td></tr>`;
  return `<div class="bbreak evb">
    <div class="cap">Graded ${season?esc(season)+" ":""}${esc(scope)}, ${e.set.n} in all. * means under 20 bets, which is mostly noise. Edge is the model's own number before the haircut.</div>
    <table>${head("Model edge")}<tbody>${e.byEdge.map(([l,a])=>row(l,a)).join("")}</tbody></table>
    <div class="cap">By confidence tier, the same tiers the Recommended list ranks by.</div>
    <table>${head("Tier")}<tbody>${e.byTier.map(([l,a])=>row(l,a)).join("")}</tbody></table>
    <div class="cap">Sizing, in hindsight on these same picks. Units are in stake units, so 2.5 units on a bet counts 2.5 times its flat result.</div>
    <table><thead><tr><th>Plan</th><th>Bets</th><th>Staked</th><th>Profit</th><th>Return</th></tr></thead><tbody>
      ${sizedRow("Flat 1 unit on every bet",e.set.n,e.set.n,e.set.units)}
      ${sizedRow("2.5 on Strong, 1 on Base, skip the rest",e.sized.bets,e.sized.staked,e.sized.units)}</tbody></table>
    <div class="cap" style="padding-bottom:12px">The tiers were set after looking at this data, so expect weaker results going forward. Only move real money to 2.5 units if Strong keeps beating Base over 100+ bets.</div></div>`;
}

function buildRecap(rows){
  const seasons=rows.map(r=>N(r.season)).filter(x=>x!==null),season=seasons.length?Math.max(...seasons):null;
  const mk=()=>({n:0,w:0,l:0,p:0,units:0,ps:0,pn:0});
  const status={BET:mk(),LEAN:mk(),PASS:mk(),ALL:mk()},market={winner:mk(),spread:mk(),total:mk()};
  const bands=[[50,60],[60,70],[70,80],[80,90],[90,101]].map(([lo,hi])=>Object.assign(mk(),{lo,hi}));
  let pending=0;
  const add=(a,o,u,p)=>{a.n++;a[o]++;a.units+=u;if(p!==null){a.ps+=p;a.pn++}};
  for(const r of rows){
    if(season!==null&&N(r.season)!==season)continue;
    const o=ledgerOutcome(r);
    if(!o){pending++;continue}
    const u=ledgerUnits(r,o),prob=N(r.model_prob);
    const st=String(r.status||"").trim().toUpperCase(),mkt=String(r.market||"").trim().toLowerCase();
    if(status[st])add(status[st],o,u,prob);
    add(status.ALL,o,u,prob);
    if(st==="BET"&&market[mkt])add(market[mkt],o,u,prob);
    if(prob!==null){const bd=bands.find(b=>prob*100>=b.lo&&prob*100<b.hi);if(bd)add(bd,o,u,prob)}
  }
  const fin=a=>({n:a.n,w:a.w,l:a.l,p:a.p,units:Math.round(a.units*10)/10,prob:a.pn?a.ps/a.pn*100:null});
  const out={season,pending,status:{},market:{},bands:[]};
  for(const k in status)out.status[k]=fin(status[k]);
  for(const k in market)out.market[k]=fin(market[k]);
  out.bands=bands.map(b=>({lo:b.lo,hi:b.hi,n:b.n,said:b.pn?Math.round(b.ps/b.pn*100):null,won:b.w+b.l?Math.round(b.w/(b.w+b.l)*100):null}));
  return out;
}

function recRow(r,showBest){
  const st=r.status,adj=r._adj,cls=adj===null?"":adj>=0?"pos":"neg";
  const fee=N(r.fee)||0,be=r._price===null?null:r._price+fee*100;
  const band=bandFor(RECAP,r._prob),rm=RECAP&&RECAP.market[r.market];
  const pills=[`<span class="pill">${esc(MKT[r.market]||r.market)}</span>`,
    `<span class="pill ${st==="BET"?"bet":st==="LEAN"?"lean":""}">${esc(st)}</span>`];
  if(r._flags.length)pills.push(`<span class="pill warn">Check first</span>`);
  if(showBest&&r._best&&r._multi)pills.push(`<span class="pill">Best in game</span>`);
  if(r._started)pills.push(`<span class="pill">Started</span>`);
  return `<details><summary class="x-row">
    <span class="rk">${r._rank}</span>
    <span class="tm"><b>${esc(r.pick)}</b><small>${esc(r.game)}, ${esc(r.kickoff)}</small><span class="pills">${pills.join("")}</span></span>
    <span class="xr"><b class="${cls}">${adj===null?"–":sgn(adj)+"c"}</b><small>${esc(r.action)} at ${esc(r.price_cents)}c</small></span></summary>
    <div class="detail">
      ${tile("Buy",`${esc(r.action)} at ${esc(r.price_cents)}c`)}
      ${tile("Model chance",r._prob===null?"–":`${f1(r._prob,1)}%`)}
      ${tile("Break-even chance",be===null?"–":`${f1(be,1)}%`)}
      ${tile("Model edge, after fee",r._raw===null?"–":`${sgn(r._raw)}c`)}
      ${tile("Edge after haircut",adj===null?"–":`${sgn(adj)}c`)}
      ${tile("Fee per contract",`${f1(fee*100,1)}c`)}
      ${tile("Model line / total",`${esc(r.model_line)} / ${f1(r.model_total)}`)}
      ${band?tile("Past picks at this model chance",`said ${band.said}%, won ${band.won}%`):""}
      <div class="wide">Kalshi market: ${esc(r.market_title)} (${esc(r.ticker)})</div>
      ${rm&&rm.n?`<div class="wide">Past BET picks in this category: ${rm.w}-${rm.l}${rm.p?"-"+rm.p:""}, ${sgn(rm.units)} units.</div>`:""}
      ${r._flags.map(f=>`<div class="wide">Check first: ${esc(f)}</div>`).join("")}</div></details>`;
}

function renderList(tab,rows){
  if(tab==="games"){
    let out="",last="";
    for(const g of rows){const d=dayOf(g.kickoff);if(g._grouped&&d!==last){out+=`<div class="day">${esc(d)}</div>`;last=d}out+=gameRow(g)}
    return out;
  }
  const fn={rankings:rankingRow,cover:coverRow,bets:betRow}[tab];
  return rows.map(r=>fn(r)).join("");
}

// ---- CFB bets: weeks, logic and row ----
// Week from a date: the week of the first Saturday on or after it (Sunday starts the next week's bets).
function weekFromDate(s,w1){
  const p=String(s).split("-").map(Number);
  const t=Date.UTC(p[0],p[1]-1,p[2]),dow=new Date(t).getUTCDay();
  const sat=t+((6-dow+7)%7)*86400000;
  return Math.max(0,Math.round((sat-w1)/604800000)+1);
}
function weekOf(b){return Number.isInteger(b.week)?b.week:weekFromDate(b.date,W1)}

// Sports other than CFB are hidden on this page, but their saved bets are kept so nothing is lost or removed from sync.
const SPORTS={cfb:1,golf:1,nfl:1,mlb:1};
const sportOf=b=>SPORTS[b&&b.sport]?b.sport:"cfb";   // older bets have no sport and count as CFB
const Bets=(()=>{
  const ST=["pending","won","lost","push"];
  const toCents=v=>{const x=String(v==null?"":v).replace(/[$,\s]/g,"");if(x==="")return NaN;const n=Number(x);return Number.isFinite(n)?Math.round(n*100):NaN};
  const money=(c,signed)=>{if(c==null||Number.isNaN(c))return "–";const a=(Math.abs(c)/100).toLocaleString("en-US",{style:"currency",currency:"USD"});return c<0?"-"+a:signed&&c>0?"+"+a:a};
  const pnl=b=>b.status==="won"?b.payout-b.cost:b.status==="lost"?-b.cost:b.status==="push"?0:null;
  const validate=f=>{
    if(!String(f.game||"").trim())return "Enter the game.";
    if(!String(f.bet||"").trim())return "Enter the bet you placed.";
    const c=toCents(f.cost),p=toCents(f.payout);
    if(!(c>0))return "Enter a cost greater than $0.";
    if(!(p>0))return "Enter the max payout.";
    if(p<=c)return "Max payout must be more than the cost.";
    if(!/^\d{4}-\d{2}-\d{2}$/.test(String(f.date||"")))return "Pick a date.";
    if(f.week!=null&&String(f.week).trim()!==""&&!/^\d{1,2}$/.test(String(f.week).trim()))return "Week must be a whole number like 6, or leave it blank.";
    return "";
  };
  const summarize=bets=>{
    const s={open:0,atRisk:0,potentialPayout:0,w:0,l:0,p:0,net:0,staked:0};
    for(const b of bets){
      if(b.status==="pending"){s.open++;s.atRisk+=b.cost;s.potentialPayout+=b.payout;continue}
      s.net+=pnl(b);
      if(b.status==="won"){s.w++;s.staked+=b.cost}else if(b.status==="lost"){s.l++;s.staked+=b.cost}else s.p++;
    }
    s.potentialProfit=s.potentialPayout-s.atRisk;
    s.roi=s.staked>0?s.net/s.staked:null;
    return s;
  };
  const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const guard=t=>/^[=+\-@\t\r]/.test(t)?"'"+t:t, unguard=t=>/^'[=+\-@\t\r]/.test(t)?t.slice(1):t;
  const qt=t=>{t=String(t==null?"":t);return /[",\n\r]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t};
  const usd=c=>(c/100).toFixed(2);
  const toCSV=bets=>["id,sport,week,date,game,bet,cost,max_payout,status,pnl,notes"].concat(bets.map(b=>{const v=pnl(b);
    return [b.id,sportOf(b),weekOf(b),b.date,qt(guard(b.game)),qt(guard(b.bet)),usd(b.cost),usd(b.payout),b.status,v==null?"":usd(v),qt(guard(b.notes||""))].join(",")})).join("\n")+"\n";
  const fromCSV=(text,defaultSport)=>{
    defaultSport=SPORTS[defaultSport]?defaultSport:"cfb";
    const rows=parseCSV(String(text).replace(/^\uFEFF/,"")).map(r=>Object.fromEntries(Object.entries(r).map(([k,v])=>[k.trim().toLowerCase().replace(/[\s-]+/g,"_"),String(v).trim()])));
    const bets=[];let skipped=0;
    for(const r of rows){
      const f={game:unguard(r.game||""),bet:unguard(r.bet||r.your_bet||""),cost:r.cost||"",payout:r.max_payout||r.maxpayout||r.payout||"",date:r.date||""};
      if(validate(f)){skipped++;continue}
      const st=(r.status||r.result||"").toLowerCase();
      const sp=(r.sport||"").toLowerCase(),sport=SPORTS[sp]?sp:sp==="pga"?"golf":defaultSport;
      const rec={id:r.id||newId(),sport,date:f.date,game:f.game,bet:f.bet,cost:toCents(f.cost),payout:toCents(f.payout),status:ST.includes(st)?st:"pending",notes:unguard(r.notes||"")};
      if(/^\d{1,2}$/.test(r.week||""))rec.week=parseInt(r.week,10);
      bets.push(rec);
    }
    return {bets,skipped};
  };
  // ---- sync helpers: each record carries updatedAt; deletes leave a small tombstone so they reach other devices
  const merge=(local,remote)=>{const m=new Map();for(const r of remote||[])if(r&&r.id)m.set(r.id,r);
    for(const l of local||[]){const r=m.get(l.id);if(!r||(l.updatedAt||0)>=(r.updatedAt||0))m.set(l.id,l)}return [...m.values()]};
  const purge=(all,now)=>all.filter(b=>!(b.deleted&&now-(b.updatedAt||0)>15552000000));
  const same=(a,b)=>{const k=x=>JSON.stringify([...x].sort((p,q)=>p.id<q.id?-1:p.id>q.id?1:0));return k(a)===k(b)};
  const sane=r=>!!r&&typeof r.id==="string"&&r.id!==""&&(r.deleted===true||(typeof r.game==="string"&&typeof r.bet==="string"
    &&Number.isFinite(r.cost)&&Number.isFinite(r.payout)&&r.cost>0&&r.payout>r.cost&&/^\d{4}-\d{2}-\d{2}$/.test(String(r.date))&&ST.includes(r.status)
    &&(r.sport==null||!!SPORTS[r.sport])&&(r.week==null||Number.isInteger(r.week))));
  return {ST,toCents,money,pnl,validate,summarize,newId,toCSV,fromCSV,merge,purge,same,sane};
})();
const fmtDay=s=>{const [y,m,d]=String(s).split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("en-US",{month:"short",day:"numeric"})};

  return `Ranked by model edge after a ${(c.haircut*100).toFixed(0)}-point haircut${why}. Edges above ${c.edgeCap}c are ranked down and marked Check first, since an edge that big usually means the model is missing something. Past records are calculated from ${CONFIG.files.ledger}. Model output, not betting advice. Confirm injuries and lineups before betting.`;

const BKEY="cfb_my_bets_v1",SKEY="cfb_my_bets_sync_v1";
const B={all:[],editing:null,ok:true,built:false,open:null};
const Sy={cfg:null,busy:false,again:false,timer:null,last:0};
const live=()=>B.all.filter(b=>!b.deleted&&sportOf(b)==="cfb");

function bSave(){try{localStorage.setItem(BKEY,JSON.stringify(B.all));B.ok=true}catch(e){B.ok=false}if($("bWarn"))$("bWarn").hidden=B.ok}
function bChanged(){bSave();bRefresh();if(Sy.cfg){clearTimeout(Sy.timer);Sy.timer=setTimeout(syncNow,1200);setSy("Saved here, syncing in a moment","")}}

// ---- sync through a private GitHub repository ----
const b64e=t=>{let bin="";new TextEncoder().encode(t).forEach(c=>bin+=String.fromCharCode(c));return btoa(bin)};
const b64d=t=>new TextDecoder().decode(Uint8Array.from(atob(String(t).replace(/\s/g,"")),c=>c.charCodeAt(0)));
const ghFetch=(url,token,opt={})=>fetch(url,{cache:"no-store",...opt,headers:{Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28",Authorization:"Bearer "+token,...(opt.body?{"Content-Type":"application/json"}:{})}});
const fileUrl=()=>"https://api.github.com/repos/"+Sy.cfg.repo+"/contents/"+Sy.cfg.path.split("/").map(encodeURIComponent).join("/");
async function ghError(r){
  let m="";try{m=(await r.json()).message||""}catch(e){}
  if(r.status===401)return new Error("GitHub rejected the token. It may be wrong or expired.");
  if(r.status===403)return new Error("The token isn't allowed to do that. Give it Contents: Read and write on this repository."+(m?" ("+m+")":""));
  if(r.status===404)return new Error("Repository not found. Check the name, and that the token can access it.");
  return new Error("GitHub returned "+r.status+(m?": "+m:"")+".");
}
function sLoad(){try{Sy.cfg=JSON.parse(localStorage.getItem(SKEY)||"null")}catch(e){Sy.cfg=null}}
function setSy(text,tone){const el=$("syState");if(!el)return;el.textContent=text;el.className="st"+(tone?" "+tone:"")}
function syIdle(){
  if(!Sy.cfg)return setSy("Not syncing. Your bets are saved on this device only.","");
  setSy(Sy.last?"Synced at "+new Date(Sy.last).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}):"Sync is on","good");
}
function syUi(){
  $("syNow").hidden=!Sy.cfg;$("syOff").hidden=!Sy.cfg;$("syCfg").textContent=Sy.cfg?"Sync settings":"Set up sync";
  if(Sy.cfg){$("syRepo").value=Sy.cfg.repo;$("syPath").value=Sy.cfg.path;$("syTok").placeholder="Saved on this device"}
  syIdle();
}
async function connect(repo,path,token){
  repo=String(repo).trim().replace(/^https?:\/\/github\.com\//,"").replace(/\.git$/,"").replace(/\/+$/,"");
  path=(String(path).trim()||"bets.json").replace(/^\/+/,"");
  token=String(token).trim();
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo))throw new Error("Enter the repository as owner/name, for example your-name/my-bets-data.");
  if(!token)throw new Error("Paste the access token.");
  const r=await ghFetch("https://api.github.com/repos/"+repo,token);
  if(!r.ok)throw await ghError(r);
  const j=await r.json();
  if(!j.private)throw new Error("That repository is public, so anyone could read your bets. Create a private repository and use that one.");
  if(j.permissions&&j.permissions.push===false)throw new Error("This token can only read that repository. Give it Contents: Read and write.");
  Sy.cfg={repo,path,token};localStorage.setItem(SKEY,JSON.stringify(Sy.cfg));
}
async function syncNow(){
  if(!Sy.cfg)return;
  if(Sy.busy){Sy.again=true;return}
  Sy.busy=true;clearTimeout(Sy.timer);setSy("Syncing","");
  let failed=false;
  try{
    for(let i=0;i<3;i++){
      const g=await ghFetch(fileUrl(),Sy.cfg.token);
      let sha=null,remote=[];
      if(g.status!==404){
        if(!g.ok)throw await ghError(g);
        const j=await g.json();sha=j.sha;
        try{const d=JSON.parse(b64d(j.content));remote=(Array.isArray(d.bets)?d.bets:[]).filter(Bets.sane)}
        catch(e){throw new Error("The sync file isn't valid. Open it on GitHub and fix or delete it.")}
      }
      const merged=Bets.purge(Bets.merge(B.all,remote),Date.now());
      B.all=merged;bSave();bRefresh();
      if(sha!==null&&Bets.same(merged,remote))break;
      const body={message:"Update bets",content:b64e(JSON.stringify({version:1,bets:merged},null,1))};
      if(sha)body.sha=sha;
      const p=await ghFetch(fileUrl(),Sy.cfg.token,{method:"PUT",body:JSON.stringify(body)});
      if(p.ok)break;
      if((p.status===409||p.status===422)&&i<2)continue;
      throw await ghError(p);
    }
    Sy.last=Date.now();syIdle();
  }catch(e){
    failed=true;
    setSy("Sync failed: "+(e instanceof TypeError?"no connection. Your changes are saved here and will sync when you are back online.":e.message),"bad");
  }finally{Sy.busy=false}
  if(state.tab==="bets")render();
  if(Sy.again&&!failed){Sy.again=false;syncNow()}
}

    <p class="note" id="bWarn" hidden>This browser is blocking saved data, so your bets will vanish when you close the tab. Export a CSV before you leave.</p>
    <div class="bsum" id="bSum"></div>
    <div class="bx bbreak" id="bBreak" hidden></div>
    <form class="bx" id="bForm" novalidate>
      <div class="bf">
        <div class="s5"><label for="bGame">Game</label><input id="bGame" list="bGames" autocomplete="off" placeholder="Navy @ Air Force"><datalist id="bGames"></datalist></div>
        <div class="s7"><label for="bBet">Your bet</label><input id="bBet" autocomplete="off" placeholder="Over 48.5 total points (Yes)"></div>
        <div class="s3 h"><label for="bCost">Cost ($)</label><input id="bCost" inputmode="decimal" autocomplete="off" placeholder="5.00"></div>
        <div class="s3 h"><label for="bPay">Max payout ($)</label><input id="bPay" inputmode="decimal" autocomplete="off" placeholder="10.00"></div>
        <div class="s3 h"><label for="bDate">Date</label><input id="bDate" type="date"></div>
        <div class="s3 h"><label for="bWeek">Week (optional)</label><input id="bWeek" inputmode="numeric" autocomplete="off" placeholder="Auto"></div>
        <div class="s12"><label for="bNotes">Notes (optional)</label><input id="bNotes" autocomplete="off" placeholder="Ticker, source, reason"></div>
      </div>
      <div class="bmath"><div class="m" aria-live="polite"><div><span>Profit if it wins</span><b id="mP">–</b></div><div><span>Break-even win rate</span><b id="mB">–</b></div></div>
        <div class="bact"><button type="button" class="btn" id="bCancel" hidden>Cancel</button><button type="submit" class="btn primary" id="bSubmit">Add bet</button></div></div>
      <p class="berr" id="bErr" role="alert"></p>
    </form>`;
  syUi();
  $("bForm").addEventListener("submit",e=>{
    e.preventDefault();
    const wkTxt=$("bWeek").value.trim();
    const f={game:$("bGame").value,bet:$("bBet").value,cost:$("bCost").value,payout:$("bPay").value,date:$("bDate").value,week:wkTxt};
    const err=Bets.validate(f);$("bErr").textContent=err;if(err)return;
    const rec={game:f.game.trim(),bet:f.bet.trim(),cost:Bets.toCents(f.cost),payout:Bets.toCents(f.payout),date:f.date,week:wkTxt===""?undefined:parseInt(wkTxt,10),notes:$("bNotes").value.trim()};
    if(B.editing){Object.assign(B.all.find(x=>x.id===B.editing),rec,{updatedAt:Date.now()});B.open=B.editing}
    else B.all.push(Object.assign({id:Bets.newId(),sport:"cfb",status:"pending",updatedAt:Date.now()},rec));
    bChanged();bReset();render();$("bGame").focus();
  });
  $("bCancel").onclick=bReset;
  $("bCost").oninput=bMath;$("bPay").oninput=bMath;$("bDate").oninput=bWeekHint;
  $("bBreak").addEventListener("click",e=>{const b=e.target.closest("button[data-wk]");if(!b)return;$("conf").value=b.dataset.wk;render()});
  $("bExport").onclick=()=>{
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([Bets.toCSV(live())],{type:"text/csv;charset=utf-8"}));
    a.download="my_cfb_bets_"+todayStr()+".csv";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  };
  $("bImport").onclick=()=>$("bFile").click();
  $("bFile").onchange=async e=>{
    const file=e.target.files[0];e.target.value="";if(!file)return;
    const {bets,skipped}=Bets.fromCSV(await file.text(),"cfb");
    const hidden=bets.filter(b=>b.sport!=="cfb").length;
    const at=new Map(B.all.map((b,i)=>[b.id,i]));let added=0;
    for(const b of bets){const i=at.get(b.id),rec=Object.assign({},b,{updatedAt:Date.now()});
      if(i===undefined){B.all.push(rec);at.set(b.id,B.all.length-1);added++}else if(B.all[i].deleted){B.all[i]=rec;added++}}
    bChanged();render();
    alert("Imported "+added+" bet"+(added===1?"":"s")+(bets.length-added?", "+(bets.length-added)+" already here":"")+(hidden?", "+hidden+" are for sports not shown on this page":"")+(skipped?", "+skipped+" skipped (missing or invalid fields)":"")+".");
  };
  $("list").addEventListener("change",e=>{
    const sel=e.target.closest("select[data-result]");if(!sel)return;
    const b=B.all.find(x=>x.id===sel.dataset.result&&!x.deleted);if(!b)return;
    b.status=sel.value;b.updatedAt=Date.now();B.open=b.id;bChanged();render();
  });
  $("list").addEventListener("click",e=>{
    const ed=e.target.closest("button[data-edit]");
    if(ed){bEdit(ed.dataset.edit);return}
    const dl=e.target.closest("button[data-del]");
    if(dl){const b=B.all.find(x=>x.id===dl.dataset.del&&!x.deleted);
      if(b&&confirm("Delete this bet?\n"+b.game+" - "+b.bet)){
        B.all=B.all.map(x=>x.id===b.id?{id:b.id,deleted:true,updatedAt:Date.now()}:x);
        if(B.editing===b.id)bReset();bChanged();render()}}
  });
  // sync controls
  $("syCfg").onclick=()=>{$("syForm").hidden=!$("syForm").hidden;if(!$("syForm").hidden)$("syRepo").focus()};
  $("syNow").onclick=syncNow;
  $("syForm").addEventListener("submit",async e=>{
    e.preventDefault();$("syErr").textContent="";$("syGo").disabled=true;
    try{await connect($("syRepo").value,$("syPath").value,$("syTok").value||(Sy.cfg&&Sy.cfg.token)||"");$("syTok").value="";$("syForm").hidden=true;syUi();await syncNow()}
    catch(err){$("syErr").textContent=err instanceof TypeError?"Couldn't reach GitHub. Check your connection and try again.":err.message}
    finally{$("syGo").disabled=false}
  });
  $("syOff").onclick=()=>{
    if(!confirm("Disconnect this device? Your bets stay on this device and in your GitHub repository."))return;
    localStorage.removeItem(SKEY);Sy.cfg=null;Sy.last=0;clearTimeout(Sy.timer);$("syTok").value="";$("syTok").placeholder="github_pat_...";$("syForm").hidden=true;syUi();
  };
  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&Sy.cfg&&state.tab==="bets"&&Date.now()-Sy.last>30000)syncNow()});
  window.addEventListener("online",()=>{if(Sy.cfg&&state.tab==="bets")syncNow()});
  bReset();
}
const start0=location.hash.slice(1),start=start0.startsWith("bets")?"bets":start0;   // old bookmarks like #bets_cfb still work
show(TABS.some(t=>t[0]===start)?start:"rankings");
</script>
</body>
</html>
